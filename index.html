<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Accesible</title>
  <style>
    /* === ESTILOS GENERALES === */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #dce7b2;
    }


    /* === BURBUJA FLOTANTE === */
    .chat-bubble {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #4b8028;
      color: #38c256;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(38, 83, 7, 0.2);
      transition: background 0.3s;
      z-index: 1000;
    }

    .chat-bubble:hover {
      background: #8a881a; /* Contraste mayor al pasar el mouse */
    }

    /* === CONTENEDOR DEL CHATBOT (oculto inicialmente) === */
    .chat-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 100%;
      max-width: 380px;
      height: 500px;
      background: #f2f5f5;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      overflow: hidden;
    }

    /* Cuando está activo se muestra con animación */
    .chat-container.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* === CABECERA DEL CHATBOT === */
    .chat-header {
      background: #6c832d;
      color: #f3da87;
      padding: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      position: relative;
    }

    /* Botón para cerrar el chat */
    .close-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      background: transparent;
      border: none;
      color: #ffdf77;
      font-size: 18px;
      cursor: pointer;
    }

    /* === ÁREA DE MENSAJES === */
    .messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #ffe591;
    }

    .message {
      margin: 8px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.4;
    }

    .user {
      background-color: #c0b658;
      align-self: flex-end;
      margin-left: auto;
    }

    .bot {
      background-color: #b3d485;
      align-self: flex-start;
      margin-right: auto;
    }

    /* === ÁREA DE INPUT === */
    .input-area {
      display: flex;
      border-top: 1px solid #e4d8e3;
      background: #f3adad;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .input-area button {
      padding: 12px 16px;
      background: #7aad49;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .input-area button:hover {
      background: #0f4122;
    }

    /* === ACCESIBILIDAD Y RESPONSIVIDAD === */
    @media (max-width: 480px) {
      .chat-container {
        right: 10px;
        left: 10px;
        height: 70vh; /* altura dinámica para móviles */
      }
    }
  </style>
</head>
<body>
  <!-- BURBUJA FLOTANTE -->
  <button class="chat-bubble" id="chatToggle" aria-label="Abrir chat con el bot">💬</button>

  <!-- CONTENEDOR PRINCIPAL DEL CHAT -->
  <div class="chat-container" id="chatContainer" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
    <!-- CABECERA -->
    <div class="chat-header">
      <span id="chatTitle">CHATBOT</span>
      <button class="close-btn" id="closeChat" aria-label="Cerrar chat">✖</button>
    </div>

    <!-- ÁREA DE MENSAJES -->
    <div class="messages" id="messages" role="log" aria-live="polite"></div>

    <!-- ÁREA DE INPUT -->
    <div class="input-area">
      <input type="text" id="userInput" aria-label="Escribe tu mensaje" placeholder="Escribe tu pregunta..." />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <script>
    // === REFERENCIAS A ELEMENTOS DEL DOM ===
    const chatToggle = document.getElementById("chatToggle");
    const chatContainer = document.getElementById("chatContainer");
    const closeChat = document.getElementById("closeChat");
    const messages = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    /* === FUNCIÓN: agregar mensaje al área === */
    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.classList.add("message", sender);
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight; // siempre baja al último mensaje
    }

    /* === RESPUESTAS SIMPLES DEL BOT === */
    function botResponse(input) {
      const pregunta = input.toLowerCase();
      if (pregunta.includes("objetivo")) {
        return "El objetivo del proyecto es combatir la contaminacion de residuos de pesticidas e herbicidas a las fuentes hidricas y terreno.";
      } else if (pregunta.includes("que son las pesticidas")) {
        return "Los pesticidas (también conocidos como plaguicidas) son sustancias o mezclas de origen químico, biológico o natural destinadas a prevenir, destruir, atraer, repeler o controlar cualquier tipo de plaga. Son muy utiles para el campo ya que evita que las plagas.";
      } else if (pregunta.includes("que son las herbicidas")) {
        return "Los herbicidas son productos químicos o fitosanitarios diseñados para controlar, inhibir o eliminar las malas hierbas o malezas que compiten con los cultivos o plantas deseadas por agua, luz, nutrientes y espacio..";
      } else if (pregunta.includes("cual es la problematica")) {
        return "La poblematica que se lleva acabo el proyecto, es que los campecinos al terminar su labor de fertilizar sus cultivo, al limpiar sus implementos en lagos, rios, charcos , etc, contaminan el agua donde incluso bebemos de ellos. Los campecinos al utilizar herbicidas daña la capa vegetal de las tierra fetiles haciendo perder parte de terreno donde cultivaba, sus hierbas se vuelve amarillas.";
      } else if (pregunta.includes("que solucion podria haber?")) {
        return "La solución consiste en construir camas biológicas comunitarias (fosas con compost y biomasa) para que los campesinos laven allí sus equipos sin contaminar las fuentes de agua potable, promoviendo además la técnica del triple lavado . En el campo, se debe reemplazar el uso excesivo de herbicidas por un Manejo Integrado de Arvenses (corte mecánico y conservación de coberturas nobles) y aplicar materia orgánica y bioestimulantes para recuperar la capa vegetal del suelo y devolverle la vitalidad al cultivo, todo respaldado por capacitaciones breves en Buenas Prácticas Agrícolas.";
      } else if (pregunta.includes("salir")) {
        return "Gracias por conversar conmigo. ¡Éxitos! 👋";
      } else {
        return "Lo siento, aún no tengo respuesta para esa pregunta.";
      }
    }

    /* === FUNCIÓN: enviar mensaje del usuario === */
    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user"); // añade mensaje de usuario
      userInput.value = ""; // limpia input

      // pequeña pausa para simular procesamiento
      const respuesta = botResponse(text);
      setTimeout(() => addMessage(respuesta, "bot"), 400);
    }

    /* === EVENTOS === */

    // Abrir / cerrar chatbot al hacer clic en la burbuja
    chatToggle.addEventListener("click", () => {
      chatContainer.classList.add("active");
      userInput.focus();
    });

    // Cerrar chatbot y limpiar historial de mensajes
    closeChat.addEventListener("click", () => {
      chatContainer.classList.remove("active");
      messages.innerHTML = ""; // limpia mensajes automáticamente
    });

    // Botón enviar
    sendBtn.addEventListener("click", sendMessage);

    // Enviar con tecla Enter
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
    /*************************************************************************
     * Inicialización: añadir mensaje de bienvenida (opcional)
     *************************************************************************/
    (function init() {
      // Mensaje inicial del bot para orientar al aprendiz
      addMessage('Hola — soy el asistente del proyecto. Puedes preguntar por el "objetivo", "que son las pesticidas", "que son las herbicidas", "cual es la problematica?" o "que solucion podria haber?".', 'bot');
    })();
  </script>
</body>
</html>
